    <!-- Marketing/visitor trackers (GA, Apollo, Leadsy) — CONSENT-GATED (S-7, codebase-scan).
         Public client-side IDs, not secrets. These load ONLY after the visitor accepts the cookie
         banner (localStorage ts_cookie_consent==='accepted'), matching the banner's promise and how
         Mixpanel is gated. window.__loadTouchstonesTrackers() is idempotent + hostname-gated inside;
         it runs here if consent was given on a prior visit, and CookieConsent calls it on Accept. -->
    <script>
      window.__loadTouchstonesTrackers = function () {
        if (window.__ttTrackersLoaded) return;
        var h = location.hostname;
        var isProdMarketing = (h === 'touchstones.ai' || h === 'www.touchstones.ai' || h === 'app.touchstones.ai');
        var isAppHost = isProdMarketing || h === 'touchstone-app.vercel.app';
        if (!isAppHost) return; // never on localhost / other dev hosts
        window.__ttTrackersLoaded = true;

        // Google Analytics (marketing + live app)
        var GA_ID = 'G-19VKZN4F0F';
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(ga);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);

        // Apollo + Leadsy are registered to the touchstones.ai domains only (they CORS/400 on
        // the vercel.app alias), so keep them to those hosts.
        if (isProdMarketing) {
          var n = Math.random().toString(36).substring(7);
          var apollo = document.createElement('script');
          apollo.src = 'https://assets.apollo.io/micro/website-tracker/tracker.iife.js?nocache=' + n;
          apollo.async = true; apollo.defer = true;
          apollo.onload = function () { window.trackingFunctions && window.trackingFunctions.onLoad({ appId: '6a4137bb875233001ccd30a6' }); };
          document.head.appendChild(apollo);

          var leadsy = document.createElement('script');
          leadsy.id = 'vtag-ai-js';
          leadsy.async = true;
          leadsy.src = 'https://r2.leadsy.ai/tag.js';
          leadsy.setAttribute('data-pid', '1brZT6CBFAdqnmL1');
          leadsy.setAttribute('data-version', '062024');
          document.head.appendChild(leadsy);
        }
      };
      try {
        if (localStorage.getItem('ts_cookie_consent') === 'accepted') window.__loadTouchstonesTrackers();
      } catch (e) { /* storage blocked → no tracking, fail safe */ }
    </script>
